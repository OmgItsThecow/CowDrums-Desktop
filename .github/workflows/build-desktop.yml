name: Build CowDrums Desktop (Windows & Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Run Unit Tests & Build Linux UberJAR + DEB
        run: gradle test packageUberJarForCurrentOS packageDeb --no-daemon
      - name: Upload Linux Standalone JAR
        uses: actions/upload-artifact@v4
        with:
          name: CowDrums-Desktop-Linux-JAR
          path: build/compose/jars/*.jar
      - name: Upload Linux DEB Installer
        uses: actions/upload-artifact@v4
        with:
          name: CowDrums-Desktop-Linux-DEB
          path: build/compose/binaries/main/deb/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Run Unit Tests & Build Windows UberJAR + MSI
        run: gradle test packageUberJarForCurrentOS packageMsi --no-daemon
      - name: Upload Windows Standalone JAR
        uses: actions/upload-artifact@v4
        with:
          name: CowDrums-Desktop-Windows-JAR
          path: build/compose/jars/*.jar
      - name: Upload Windows MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: CowDrums-Desktop-Windows-MSI
          path: build/compose/binaries/main/msi/*.msi
